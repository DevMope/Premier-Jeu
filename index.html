  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&display=swap">
<style>
    html, body { margin: 0; height: 100%; background: #1a120a; overflow: hidden; }
    #jeu { width: 100%; height: 100%; }
    /* Sur un téléphone tenu en hauteur, le jeu serait minuscule : on demande de le tourner. */
    #tourner { display: none; position: fixed; inset: 0; z-index: 10; background: #1a120a; color: #f3d98a;
      font: 600 22px "Alegreya", Georgia, serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
    #tourner { flex-direction: column; gap: 18px; }
    #tourner.visible { display: flex; }
    #tourner button { font: 600 18px "Alegreya", Georgia, serif; color: #2a1608; background: #f3d98a; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="jeu"></div>
<div id="tourner"><span>↻ Tourne ton téléphone<br>pour jouer en paysage</span><button id="tourner-quand-meme" type="button">Jouer quand même</button></div>
<script>
  // Sur un vrai téléphone tenu en hauteur, le jeu serait minuscule : on demande de le tourner.
  // (Jamais sur une tablette ni dans un panneau étroit sur un grand écran : on se fie à la taille
  // physique de l'écran, pas à celle de la fenêtre. Et on peut toujours passer outre.)
  (function () {
    var boite = document.getElementById('tourner'), ignore = false;
    function maj() {
      var petit = Math.min(screen.width, screen.height) < 500;
      var portrait = window.innerHeight > window.innerWidth;
      boite.classList.toggle('visible', petit && portrait && !ignore);
    }
    document.getElementById('tourner-quand-meme').addEventListener('click', function () { ignore = true; maj(); });
    window.addEventListener('resize', maj); window.addEventListener('orientationchange', maj);
    maj();
  })();
</script>
